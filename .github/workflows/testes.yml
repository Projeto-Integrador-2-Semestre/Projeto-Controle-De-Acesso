name: Testes

# Lint, build e testes de navegador (Playwright) em cada PR e push para main/develop.
# Os testes simulam a API dentro do próprio teste (e2e/apiFalsa.js): não precisam de segredos.
on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testes:
    name: Lint, build e testes do front
    runs-on: ubuntu-latest

    steps:
      - name: Baixa o código
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Instala o Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Instala as dependências
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Instala o Chromium do Playwright
        run: npx playwright install --with-deps chromium

      - name: Testes de navegador
        run: npm run test:e2e

      - name: Guarda os resultados em caso de falha
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: resultados-playwright
          path: test-results/
          if-no-files-found: ignore
